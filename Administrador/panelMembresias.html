<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Panel de Usuarios</title>

    <script
      src="https://kit.fontawesome.com/a0994db117.js"
      crossorigin="anonymous"
    ></script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Pliant:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link rel="icon" href="../IMG/logoSinFondo2.png" type="image/x-icon" />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />

    <link rel="stylesheet" href="../CSS/panelMembresias.css" />
  </head>

  <body>
    <header>
      <nav class="navbar navbar-expand-lg navbar-systemcloud">
        <div class="container">
          <a href="#" class="navbar-brand d-flex align-items-center gap-2">
            <img
              src="../IMG/logoSinFondo2.png"
              alt="Logo System Cloud"
              class="logo"
            />
          </a>

          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#menuPrincipal"
            aria-label="Abrir menú"
          >
            <span class="navbar-toggler-icon"></span>
          </button>

          <div class="collapse navbar-collapse" id="menuPrincipal">
            <ul class="navbar-nav ms-auto align-items-center gap-3">
              <li class="nav-item">
                <a href="./administrador.html" class="btn btn-login-nav">
                  <i class="fa-solid fa-arrow-left"></i>
                </a>
              </li>
            </ul>
          </div>
        </div>
      </nav>
    </header>

    <main class="py-5">
      <div class="container">
        <div class="text-center mb-5 pt-5">
          <h1 class="fw-bold">Gestión de Membresías</h1>
        </div>

        <div class="card bg-dark border-secondary contenedor-busqueda">
          <div class="container-fluid mt-4">
            <div class="row g-4">
              <div class="col-lg-6 col-md-6">
                <div class="membership-card">
                  <div class="card-icons">
                    <button
                      class="btn-icon edit"
                      aria-label="Editar membresía mensual"
                    >
                      <i class="fa-regular fa-pen-to-square"></i>
                    </button>

                    <button
                      class="btn-icon delete"
                      aria-label="Eliminar membresía mensual"
                    >
                      <i class="fa-regular fa-trash-can"></i>
                    </button>
                  </div>

                  <div class="membership-body">
                    <h2>
                      Mensual
                      <span>(30 días)</span>
                    </h2>

                    <h1>$99.900</h1>
                  </div>
                </div>
              </div>

              <div class="col-lg-6 col-md-6">
                <div class="membership-card">
                  <div class="card-icons">
                    <button
                      class="btn-icon edit"
                      aria-label="Editar membresía semestral"
                    >
                      <i class="fa-regular fa-pen-to-square"></i>
                    </button>

                    <button
                      class="btn-icon delete"
                      aria-label="Eliminar membresía semestral"
                    >
                      <i class="fa-regular fa-trash-can"></i>
                    </button>
                  </div>

                  <div class="membership-body">
                    <h2>
                      Semestral
                      <span>(6 meses)</span>
                    </h2>

                    <h1>$529.900</h1>
                  </div>
                </div>
              </div>

              <div class="col-lg-6 col-md-6">
                <div class="membership-card">
                  <div class="card-icons">
                    <button
                      class="btn-icon edit"
                      aria-label="Editar membresía anual"
                    >
                      <i class="fa-regular fa-pen-to-square"></i>
                    </button>

                    <button
                      class="btn-icon delete"
                      aria-label="Eliminar membresía anual"
                    >
                      <i class="fa-regular fa-trash-can"></i>
                    </button>
                  </div>

                  <div class="membership-body">
                    <h2>
                      Anual
                      <span>(12 meses)</span>
                    </h2>

                    <h1>$979.900</h1>
                  </div>
                </div>
              </div>

              <div class="col-lg-6 col-md-6">
                <button class="membership-card add-membership">
                  <div>
                    <h2>Nueva</h2>
                    <h2>Membresía</h2>
                  </div>

                  <i class="fa-solid fa-plus"></i>
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
